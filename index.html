<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schultag-Zähler OÖ</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#fff;color:#1d2b3a}
.w{box-sizing:border-box;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:3vmin;text-align:center;gap:1vmin}
.l{font-size:5vmin;color:#5a6b7d}
.n{font-size:24vmin;font-weight:800;line-height:1;color:#1f6feb}
.m{font-size:12vmin;font-weight:800;line-height:1;color:#2da44e}
.d{font-size:4vmin;color:#5a6b7d}
hr{width:70%;border:0;border-top:1px solid #e6ebf1;margin:2vmin 0}
</style></head><body><div class="w">
<div class="l" id="l1">Schultag seit 9.9.2024</div>
<div class="n" id="tot">–</div>
<div class="d" id="det"></div>
<hr>
<div class="l" id="l2">Schultag im Schuljahr 2026/27</div>
<div class="m" id="cur">–</div>
</div>
<script>
/* Volksschule Oberösterreich – schulfreie Tage (Mo–Fr werden nur gezählt, wenn nicht frei) */
var JAHRE=[
 {n:'2024/25',s:'2024-09-09',e:'2025-07-04',f:[['2024-10-26','2024-11-02'],['2024-12-08','2024-12-08'],['2024-12-21','2025-01-06'],['2025-02-15','2025-02-23'],['2025-04-12','2025-04-21'],['2025-05-01','2025-05-01'],['2025-05-04','2025-05-04'],['2025-05-29','2025-05-29'],['2025-06-07','2025-06-09'],['2025-06-19','2025-06-19']]},
 {n:'2025/26',s:'2025-09-08',e:'2026-07-10',f:[['2025-10-26','2025-11-02'],['2025-12-08','2025-12-08'],['2025-12-24','2026-01-06'],['2026-02-14','2026-02-22'],['2026-03-28','2026-04-06'],['2026-05-01','2026-05-01'],['2026-05-04','2026-05-04'],['2026-05-14','2026-05-14'],['2026-05-23','2026-05-25'],['2026-06-04','2026-06-04']]},
 {n:'2026/27',s:'2026-09-14',e:'2027-07-09',f:[['2026-10-24','2026-11-02'],['2026-12-08','2026-12-08'],['2026-12-24','2027-01-06'],['2027-02-13','2027-02-21'],['2027-03-20','2027-03-29'],['2027-05-01','2027-05-01'],['2027-05-04','2027-05-04'],['2027-05-06','2027-05-06'],['2027-05-15','2027-05-17'],['2027-05-27','2027-05-27']]}
];
/* Schulautonome Tage hier ergänzen, z. B. ['2026-12-07','2026-12-07'] */
var AUTONOM=[];
function D(s){var p=s.split('-');return new Date(+p[0],p[1]-1,+p[2]);}
function k(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function zaehle(j,h){var fr=j.f.concat(AUTONOM).map(function(x){return[k(D(x[0])),k(D(x[1]))];}),c=0,d=D(j.s),e=D(j.e);
 for(;d<=e&&d<=h;d.setDate(d.getDate()+1)){var w=d.getDay(),x=k(d),frei=false;if(w==0||w==6)continue;
  for(var i=0;i<fr.length;i++)if(x>=fr[i][0]&&x<=fr[i][1]){frei=true;break;}if(!frei)c++;}return c;}
function upd(){var t=new Date(),h=new Date(t.getFullYear(),t.getMonth(),t.getDate()),tot=0,parts=[],cur=0,curN='';
 JAHRE.forEach(function(j){var c=zaehle(j,h);tot+=c;parts.push(c);if(h>=D(j.s)){cur=c;curN=j.n;}});
 document.getElementById('tot').textContent=tot+'.';
 document.getElementById('det').textContent=parts.join(' + ');
 document.getElementById('l2').textContent='Schultag im Schuljahr '+curN;
 document.getElementById('cur').textContent=cur+'.';}
upd();setInterval(upd,600000);
</script></body></html>
