<style>
:root{--bg:#f4f7fb;--ink:#1d2733;--mut:#5b6b7d;--card:#fff;--line:#d9e2ec;--ok:#2e9e5b;--okbg:#e3f6ea;--bad:#d64545;--badbg:#fde8e8;--pri:#2563eb}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Verdana,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1}
header .prog{font-size:16px;color:var(--mut)}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:12px 18px;min-height:56px;touch-action:manipulation}
button:active{transform:scale(.98)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.small{min-height:44px;padding:8px 14px;font-size:17px}
button:disabled{opacity:.55;cursor:default}
main{max-width:900px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.big{display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px;border-radius:18px;background:var(--card);border:2px solid var(--line);min-height:120px}
.big b{font-size:24px}.big span{font-size:17px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chip{border-radius:999px;padding:8px 16px;min-height:48px;border-width:3px}
.sub{color:var(--mut);font-size:17px}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin-top:12px}
.qcard h2{font-size:24px;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;width:100%}
.opt.sel{border-color:var(--pri);background:#eaf1ff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:14px;padding:14px;border-radius:14px;font-size:19px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
input[type=text]{font:inherit;width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;min-height:56px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.match button{font-size:18px;text-align:left}
.match .ok{border-color:var(--ok);background:var(--okbg)}
.match .sel{border-color:var(--pri);background:#eaf1ff}
.match .bad{border-color:var(--bad);background:var(--badbg)}
.flash{background:var(--card);border:3px solid var(--pri);border-radius:22px;min-height:230px;padding:26px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;cursor:pointer;user-select:none}
.flash.back{background:#eaf1ff}
.tag{display:inline-block;font-size:14px;font-weight:700;color:#fff;border-radius:999px;padding:2px 10px;margin-bottom:8px}
.sheet section{background:var(--card);border:2px solid var(--line);border-left-width:10px;border-radius:14px;padding:6px 18px 12px;margin:16px 0;break-inside:avoid}
.sheet h2{font-size:25px;margin:12px 0 4px}
.sheet h3{font-size:19px;margin:12px 0 2px;color:var(--mut)}
.sheet ul{margin:4px 0 0;padding-left:22px}.sheet li{margin:3px 0;font-size:19px}
.stars{font-size:54px;text-align:center;letter-spacing:6px}
.rev{border-left:6px solid var(--bad);background:var(--card);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:18px}
.note{font-size:64px;font-weight:800;text-align:center;line-height:1.1}
.ov{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:18px}
.ov .st{font-size:22px;min-width:30px}.ov small{display:block;color:var(--mut);font-size:15px}
details{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 16px;margin:10px 0}
summary{cursor:pointer;font-weight:700;font-size:20px;padding:10px 0;min-height:48px}
.hist{display:flex;justify-content:space-between;width:100%;text-align:left}
@media(max-width:640px){body{font-size:18px}.match{grid-template-columns:1fr}}
@media print{header,.noprint{display:none!important}body{background:#fff;font-size:13px}.sheet li{font-size:13px}.sheet h2{font-size:17px}.sheet section{border-width:1px 1px 1px 6px;margin:8px 0;padding:2px 12px 8px}main{max-width:none;padding:0}}
</style>
</head>

const TOPICS=[
{id:"land",title:"Österreich & Nachbarländer",icon:"🇦🇹",color:"#d64545",sections:[
 {h:"Lage",items:["Österreich liegt in der <b>Mitte Europas</b>. Es ist ein <b>Binnenland</b> – es grenzt an <b>kein Meer</b>.","Österreich hat <b>9 Bundesländer</b>. Niederösterreich ist das größte.","<b>Wien</b> ist die Hauptstadt von ganz Österreich (Bundeshauptstadt) und zugleich ein Bundesland."]},
 {h:"9 Bundesländer – 9 Hauptstädte",items:["Wien – Wien","Niederösterreich – <b>St. Pölten</b>","Oberösterreich – <b>Linz</b>","Salzburg – Salzburg","Tirol – <b>Innsbruck</b>","Vorarlberg – <b>Bregenz</b>","Kärnten – <b>Klagenfurt</b>","Steiermark – <b>Graz</b>","Burgenland – <b>Eisenstadt</b>"]},
 {h:"8 Nachbarländer",items:["<b>Deutschland, Tschechien, Slowakei, Ungarn, Slowenien, Italien, Schweiz, Liechtenstein</b>","Aufgepasst: <b>Slowakei</b> (im Nordosten) und <b>Slowenien</b> (im Süden) sind verschiedene Länder!"]}]},
{id:"noe",title:"Niederösterreich: Wappen, Viertel, Berge",icon:"🏔️",color:"#2563eb",sections:[
 {h:"Das Wappen",items:["Fünf <b>goldene Adler</b> auf <b>blauem Grund</b> (Adlerflügel). Über dem Wappen: eine <b>Herzogskrone</b>.","Es erinnert an die lange Geschichte: NÖ war früher Teil des <b>Herzogtums Österreich</b>. Ein Herzog war ein Herrscher.","Die fünf Adler stammen aus dem Wappen der <b>Grafen von Habsburg-Laufenburg</b>.","Farben und Zeichen halfen, die Herrscherfamilie zu erkennen – auch heute ist das Wappen ein wichtiges Zeichen für NÖ."]},
 {h:"Die Viertel",items:["<b>Waldviertel</b> – nördlich der Donau. Flache, bewaldete Hügel, keine hohen spitzen Gipfel. <b>Rumpfgebirge</b> (Granit- und Gneishochland), ein sehr altes Gebirge.","<b>Mostviertel</b> – hier steht der <b>Ötscher</b>, ein markanter Berg und beliebtes Wandergebiet. Die Menschen nennen ihn liebevoll <b>„Vaterberg“</b>.","<b>Industrieviertel</b> – im Süden, mit den hohen Bergen der <b>Alpen</b>: <b>Schneeberg</b> und <b>Rax</b>.","<b>Weinviertel</b> – das vierte Viertel (nicht im Heft, aber gut zu wissen)."]},
 {h:"Berge",items:["Der <b>Schneeberg</b> ist mit <b>2 076 m</b> der allerhöchste Berg Niederösterreichs. Gleich daneben liegt die <b>Rax</b>.","Die hohen Berge im Süden gehören zu den <b>Alpen</b>.","Das Waldviertel hat <b>niedrigere</b> Berge als das Industrieviertel."]}]},
{id:"reg",title:"Landesregierung, Landtag & Klangturm",icon:"🏛️",color:"#7c3aed",sections:[
 {h:"Wer regiert Niederösterreich?",items:["NÖ wird von der <b>Landesregierung</b> in <b>St. Pölten</b> regiert und verwaltet. Das Gebäude heißt <b>Landhaus</b> (Landtag).","Oberhaupt des Landes: die <b>Landeshauptfrau</b> / der Landeshauptmann.","Aktuell: Landeshauptfrau <b>Johanna Mikl-Leitner</b>. Stellvertreter: <b>Dr. Stephan Pernkopf</b> und <b>Udo Landbauer, MA</b>.","Alle NiederösterreicherInnen ab <b>16 Jahren</b> wählen alle <b>5 Jahre</b> Parteien. Die Parteien schicken <b>Abgeordnete</b> in den <b>Landtag</b>.","Der Landtag ist so etwas wie das <b>„Parlament“</b> von NÖ: Dort sprechen die PolitikerInnen über Schulen, Straßen, Umweltschutz oder neue <b>Gesetze</b>.","Die Mitglieder der Landesregierung treffen wichtige <b>Entscheidungen</b>. An Gesetze müssen sich alle Menschen halten."]},
 {h:"Landhaus & Regierungsviertel",items:["Das <b>Landhausviertel</b> (= <b>Regierungsviertel</b>) wurde <b>1997</b> fertig gebaut.","Das Landhaus sieht <b>modern</b> aus und wie ein <b>großes Schiff</b> („Landhausschiff“).","Schulklassen können Führungen machen und im <b>Sitzungssaal</b> einen Blick in den Landtag werfen."]},
 {h:"Der Klangturm",items:["Das markante <b>Wahrzeichen</b> des Regierungsviertels von St. Pölten.","<b>77 Meter</b> hoch, <b>280 Stufen</b> im Inneren (es gibt auch einen Lift).","Gebaut 1996–1997 vom Architekten <b>Ernst Hoffmann</b>, aus <b>Stahl und Glas</b>.","Ursprünglich als <b>Klangkunstmuseum</b> gedacht. In den <b>drei Kugeln</b> gibt es Klanginstallationen – sie läuten nur noch bei besonderen Anlässen."]}]},
{id:"stp",title:"St. Pölten",icon:"⛪",color:"#0d9488",sections:[
 {h:"Landeshauptstadt",items:["St. Pölten ist seit <b>1986</b> die <b>Landeshauptstadt</b> von Niederösterreich. Davor war Wien auch das politische Zentrum von NÖ – das Land sollte eine eigene Hauptstadt bekommen.","Die <b>älteste dokumentierte Stadt Österreichs</b>; fast <b>60 000 Einwohner</b> (2025). Römerzeit: <b>Aelium Cetium</b>.","Hier sitzen die Landesregierung und der Landtag (Regierungsviertel)."]},
 {h:"Kloster St. Hippolyt & Dom",items:["Das <b>Benediktinerkloster St. Hippolyt</b> wurde schon im <b>8. Jahrhundert</b> gegründet. Im Mittelalter hieß St. Pölten „Sanctus Ypolit(us)“ → daraus entstand der Name.","Die Mönche lebten, beteten und arbeiteten dort, kümmerten sich um Kranke, unterrichteten junge Menschen und schrieben Bücher.","Später wurde das Kloster in ein <b>Stift</b> umgewandelt. Heute steht dort der <b>Dom von St. Pölten</b> (früher die Klosterkirche). Der <b>Domplatz</b> war früher ein <b>Friedhof</b>.","Alte Teile sieht man noch: <b>Kreuzgang</b> und <b>Krypta</b> (unterirdisch). Die Statue des hl. Hippolyt hält ein <b>Kreuz</b>."]},
 {h:"Rathaus & Dreifaltigkeitssäule (Rathausplatz)",items:["Das <b>Rathaus</b>: großes, barockes Gebäude; Teile stammen aus dem <b>16. Jahrhundert</b> (früher war es ein Kloster). Großer Turm mit <b>Glockenspiel</b>, alte Fenster.","Im Rathaus arbeiten der <b>Bürgermeister</b> und viele Angestellte, die sich um die Stadt kümmern (Stadtverwaltung).","Die <b>Dreifaltigkeitssäule</b>: Kunstwerk aus <b>weißem Marmor</b>, über 250 Jahre alt (<b>18. Jahrhundert</b>).","Gebaut aus <b>Dank</b> und als <b>Versprechen (Gelöbnis)</b>: Die Stadt blieb von Krankheiten und Feuer verschont.","Unten: ein <b>Brunnen</b> mit Wasser und vier Heilige (<b>Leopold, Hippolyt, Sebastian, Florian</b>). Oben: die <b>Heilige Dreifaltigkeit</b> (Gott Vater, Jesus, Heiliger Geist), Engel und Wolken.","Einzige Säule in NÖ, die <b>Brunnen und Dreifaltigkeit</b> in einem Bauwerk vereint."]},
 {h:"Weitere Sehenswürdigkeiten",items:["<b>Zwiebelmusterhaus</b> („Tellerhaus“): Rundherum viele Teller mit blauem Muster; Statue des hl. Hippolyt an der Ecke Kremser Gasse. (Arbeitsblatt: <b>168 Teller</b> – bitte mit dem Heft vergleichen.)","<b>Apotheke „Zum goldenen Löwen“</b>: Ecke Wiener Straße/Kremser Gasse, die <b>älteste Apotheke</b> der Stadt – seit <b>1595</b>.","<b>Mary Ward Schulen</b> (Linzer Straße): ursprünglich Kloster und Schule für adelige Mädchen; Barockfassade von <b>Jakob Prandtauer</b>.","<b>Festspielhaus</b>: moderner Konzertsaal mit 1 100 Sitzplätzen; Architekt <b>Klaus Kada</b>.","<b>Landestheater</b>: klassische Fassade mit großen Fenstern; Theater, Konzerte und weitere Veranstaltungen.","<b>Jugendstilhaus</b> von <b>Josef Olbrich</b> (nahe beim Regierungsviertel, Wiener Straße)."]},
 {h:"Die Traisen",items:["Der <b>Fluss Traisen</b> fließt durch St. Pölten.","Wichtig für <b>Natur</b> (Lebensraum für Fische, Vögel, Tiere), <b>Freizeit</b> (spazieren, Rad fahren), <b>Wasser</b> (Wasserhaushalt), <b>Grünraum</b> und <b>Stadtbild</b>.","<b>Hochwasserschutz</b>: Maßnahmen an der Traisen schützen die Stadt vor Hochwasser."]}]},
{id:"muell",title:"Mülltrennung",icon:"♻️",color:"#2e9e5b",sections:[
 {h:"Warum trennen wir Müll?",items:["Viele Materialien können <b>wiederverwendet oder recycelt</b> werden.","Wir sparen <b>Rohstoffe und Energie</b> und schützen die <b>Umwelt</b>.","Weniger Müll gelangt in die Natur, in Flüsse und Meere. <b>Gefährliche Abfälle</b> werden richtig entsorgt.","<b>Merke:</b> Je besser wir trennen, desto mehr kann wiederverwertet werden."]},
 {h:"Die wichtigsten Müllarten",items:["<b>Papier</b>: Zeitung, Heft, Karton, Bücher → daraus wird <b>neues Papier</b>. Möglichst <b>sauber und trocken</b> sammeln.","<b>Glas</b>: Glasflasche, Marmeladenglas.","<b>Bioabfall</b>: Obst- und Gemüsereste, Eierschalen, Kaffeesatz, Pflanzenreste → daraus kann <b>Kompost</b> (oder Energie) werden.","<b>Verpackungen</b>: Kunststoff (Plastikflaschen, Joghurtbecher) und <b>Metall</b> (Aludosen, Konservendosen) → daraus entstehen neue Produkte.","<b>Restmüll</b>: Abfälle, die nicht anders gesammelt werden (z. B. benutztes Taschentuch).","<b>Problemstoffe</b>: Batterien, Farben und andere gefährliche Stoffe – <b>nie</b> in den Restmüll!","Nicht alle Gemeinden haben genau dieselben Sammelregeln."]},
 {h:"Müll vermeiden ist noch besser",items:["Jausenbox mit vielen einzeln verpackten Snacks → <b>wiederbefüllbare Jausenbox</b> verwenden.","T-Shirt mit kleinem Loch → <b>flicken</b> (oder als Putzlappen/Spielkleidung weiterverwenden).","Flasche Wasser für die Schule → <b>Trinkflasche wieder befüllen</b>.","Kaputtes Spielzeug → <b>reparieren</b>, brauchbare Teile weiterverwenden."]}]},
{id:"nat",title:"26. Oktober – Nationalfeiertag",icon:"🎉",color:"#d97706",sections:[
 {h:"Zeitstrahl",items:["<b>1939–1945: 2. Weltkrieg</b> – sechs Jahre Krieg. Millionen Menschen wurden getötet oder verletzt, Häuser, Fabriken, Kirchen, Brücken, Wälder und Felder wurden zerstört.","<b>1945–1955: Wiederaufbau.</b> Amerikaner, Russen, Briten und Franzosen (die Besatzungsmächte) befreiten unser Land. Die Soldaten blieben und halfen beim Wiederaufbau. Österreich wollte einen freien, unabhängigen Staat.","<b>15. Mai 1955:</b> Unterzeichnung des <b>Staatsvertrages</b> im <b>Schloss Belvedere</b> in Wien. Außenminister <b>Leopold Figl</b> rief den jubelnden ÖsterreicherInnen zu: „Österreich ist frei!“","<b>25. Oktober 1955:</b> Die letzten Soldaten der Besatzungsmächte verließen Österreich.","<b>26. Oktober 1955:</b> Österreich beschließt das Gesetz über die <b>Neutralität</b>. Seitdem ist der 26. Oktober unser <b>Nationalfeiertag</b>."]},
 {h:"Neutralität",items:["Österreich nimmt an <b>keinem Krieg</b> teil und unterstützt im Kriegsfall <b>kein anderes Land</b>."]}]}
];

function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in(attrs||{})){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e[k]=attrs[k];else if(k==="html")e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k])}for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e}

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,"")}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i]}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function fuzzyOk(inp,acc){const n=norm(inp);if(!n)return false;return acc.some(a=>{const x=norm(a);if(/^\d+$/.test(x))return n===x;const tol=x.length>=9?2:x.length>=4?1:0;return lev(n,x)<=tol})}

const GRENZEN=[[90,1],[80,2],[65,3],[50,4],[0,5]]; /* ab x % gibt es Note n – bei Bedarf anpassen */

const maxPts=q=>q.k==="tf"?1:q.k==="mc"?2:q.k==="tx"?3:q.p.length;
function qid(q){let s=q.t+"|"+q.q+(q.k==="mt"?"|"+q.p.map(p=>p[0]).join(","):"");let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))>>>0;return q.k+x.toString(36)}

const KEY="sachu4_v1";let store={hist:[],stat:{}},storeOK=true;

function record(mode,res){const now=Date.now(),m=mode==="test"?"t":"p";
  res.forEach(r=>{const s=store.stat[qid(r.q)]||(store.stat[qid(r.q)]={}),e=s[m]||(s[m]={ok:0,bad:0});r.ok?e.ok++:e.bad++;e.last=r.ok?1:0;e.ts=now});save()}

/* ---------- Karteikarten ---------- */
function makeCards(topics){
  const out=[];
  Q.filter(q=>topics.includes(q.t)).forEach(q=>{
    if(q.k==="mc")out.push({t:q.t,f:q.q,b:q.c+(q.e?"\n"+q.e:"")});
    else if(q.k==="tf")out.push({t:q.t,f:"Stimmt das?\n"+q.q,b:(q.a?"✅ Richtig":"❌ Falsch")+(q.e?"\n"+q.e:"")});
    else if(q.k==="tx")out.push({t:q.t,f:q.q,b:q.acc[0]+(q.e?"\n"+q.e:"")});
    else if(q.k==="mt")q.p.forEach(p=>out.push({t:q.t,f:q.card.replace("{l}",p[0]),b:p[1]}));
  });
  const seen=new Set();return out.filter(c=>{const k=c.f+"|"+c.b;if(seen.has(k))return false;seen.add(k);return true});
}
function cards(topics){
  let queue=shuffle(makeCards(topics)),total=queue.length,known=0,flipped=false;
  const draw=()=>{
    if(!queue.length){show("Karteikarten",h("div",{class:"qcard"},h("h2",{},"🎉 Alle Karten gewusst!"),h("p",{},total+" Karten geschafft."),h("div",{class:"row"},h("button",{class:"pri",onclick:()=>cards(topics)},"Nochmal"),h("button",{onclick:home},"Menü"))));return}
    const c=queue[0];flipped=false;
    const box=h("div",{class:"flash",onclick:flip},h("div",{},c.f.split("\n").map((l,i)=>h("div",{},l))));
    const tag=h("span",{class:"tag",style:"background:"+TM[c.t].color},TM[c.t].icon+" "+TM[c.t].title);
    const btns=h("div",{class:"row",style:"visibility:hidden"},h("button",{class:"pri",onclick:()=>{known++;queue.shift();draw()}},"✅ Gewusst"),h("button",{onclick:()=>{queue.push(queue.shift());draw()}},"🔁 Nochmal"));
    function flip(){if(flipped){flipped=false;box.classList.remove("back");box.replaceChildren(h("div",{},c.f.split("\n").map(l=>h("div",{},l))));btns.style.visibility="hidden";return}
      flipped=true;box.classList.add("back");box.replaceChildren(h("div",{},c.b.split("\n").map((l,i)=>h("div",{style:i?"font-size:20px;color:#5b6b7d;margin-top:10px":"font-weight:700"},l))));btns.style.visibility="visible"}
    show("Karteikarten",tag,box,h("p",{class:"sub"},"Tippe auf die Karte zum Umdrehen."),btns,h("p",{class:"sub"},"Gewusst: "+known+" von "+total));
  };draw();
}

/* ---------- Fragen anzeigen ---------- */
function runSession(title,list,mode,onEnd){
  const queue=list.map(q=>({q,retry:false})),results=[];let n=0,total=queue.length;
  const next=()=>{
    if(!queue.length){onEnd(results);return}
    const it=queue.shift(),q=it.q;n++;
    const box=h("div",{class:"qcard"});
    const mp=maxPts(q);
    const tag=h("div",{},h("span",{class:"tag",style:"background:"+TM[q.t].color},TM[q.t].icon+" "+TM[q.t].title)," ",h("span",{class:"tag",style:"background:#64748b"},mp+(mp>1?" Punkte":" Punkt")));
    const bar=h("div",{class:"bar"},h("i",{style:"width:"+Math.round((total-queue.length-1)/total*100)+"%"}));
    show(title,tag,box,bar);
    $("#prog").textContent="Frage "+Math.min(n,total)+" / "+total;
    renderQ(q,mode,box,(ok,given,ans,pts)=>{
      if(!it.retry)results.push({q,ok,given,ans,max:mp,pts:pts===undefined?(ok?mp:0):pts});
      if(mode==="practice"&&!ok&&!it.retry)queue.push({q,retry:true});
      next();
    });
  };next();
}
function fbBox(ok,q){return h("div",{class:"fb "+(ok?"ok":"bad")},h("b",{},ok?"✅ Richtig! ":"❌ Leider falsch. "),q.e||"")}
function renderQ(q,mode,box,done){
  if(q.k==="mc")choice(q,mode,box,done,shuffle([q.c,...q.w]),q.c,q.q);
  else if(q.k==="tf")choice(q,mode,box,done,["Richtig","Falsch"],q.a?"Richtig":"Falsch","Stimmt das? "+q.q);
  else if(q.k==="tx")typed(q,mode,box,done);
  else match(q,mode,box,done);
}
function choice(q,mode,box,done,opts,correct,text){
  let chosen=null,answered=false;
  const list=h("div",{class:"opts"}),fb=h("div"),nx=h("button",{class:"pri",style:"margin-top:14px",disabled:true},"Weiter ▶");
  const btns=opts.map(o=>h("button",{class:"opt",onclick:()=>{
    if(answered)return;chosen=o;
    if(mode==="practice"){answered=true;btns.forEach(b=>{if(b.textContent===correct)b.classList.add("ok");else if(b.textContent===o)b.classList.add("bad")});fb.replaceChildren(fbBox(o===correct,q))}
    else btns.forEach(b=>b.classList.toggle("sel",b.textContent===o));
    nx.disabled=false;
  }},o));
  list.append(...btns);nx.onclick=()=>done(chosen===correct,chosen,correct);
  box.append(h("h2",{},text),list,fb,nx);
}
function typed(q,mode,box,done){
  const inp=h("input",{type:"text",autocomplete:"off",autocapitalize:"none",spellcheck:"false",placeholder:"Antwort eintippen …"});
  const fb=h("div"),btn=h("button",{class:"pri",style:"margin-top:14px"},mode==="practice"?"Prüfen":"Weiter ▶");let checked=false,ok=false;
  btn.onclick=()=>{
    if(mode==="practice"&&!checked){checked=true;ok=fuzzyOk(inp.value,q.acc);inp.disabled=true;fb.replaceChildren(h("div",{class:"fb "+(ok?"ok":"bad")},h("b",{},ok?"✅ Richtig! ":"❌ Leider falsch. "),"Richtig ist: "+q.acc[0]+". "+(q.e||"")));btn.textContent="Weiter ▶";return}
    if(mode==="practice")done(ok,inp.value,q.acc[0]);else done(fuzzyOk(inp.value,q.acc),inp.value||"(leer)",q.acc[0]);
  };
  inp.onkeydown=e=>{if(e.key==="Enter")btn.click()};
  box.append(h("h2",{},q.q),inp,fb,btn);setTimeout(()=>{try{inp.focus()}catch(e){}},50);
}
function match(q,mode,box,done){
  const left=q.p.map((p,i)=>({i,t:p[0]})),right=shuffle(q.p.map((p,i)=>({i,t:p[1]})));
  let sel=null,wrong=0,solved=0;const nx=h("button",{class:"pri",style:"margin-top:14px",disabled:true},"Weiter ▶");
  const grid=h("div",{class:"match"});
  const lb=left.map(x=>h("button",{},x.t)),rb=right.map(x=>h("button",{},x.t));
  lb.forEach((b,i)=>b.onclick=()=>{if(b.classList.contains("ok"))return;lb.forEach(o=>o.classList.remove("sel"));b.classList.add("sel");sel=i});
  rb.forEach((b,j)=>b.onclick=()=>{
    if(sel===null||b.classList.contains("ok"))return;
    const a=lb[sel];
    if(left[sel].i===right[j].i){a.classList.remove("sel");a.classList.add("ok");b.classList.add("ok");sel=null;solved++;if(solved===q.p.length)nx.disabled=false}
    else{wrong++;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),500)}
  });
  const rows=Math.max(lb.length,rb.length);for(let i=0;i<rows;i++)grid.append(lb[i],rb[i]);
  nx.onclick=()=>done(wrong===0,wrong===0?"alles richtig":wrong+" Fehlversuch(e)",q.p.map(p=>p[0]+" → "+p[1]).join("; "),Math.max(0,q.p.length-wrong));
  box.append(h("h2",{},q.q),h("p",{class:"sub"},"Tippe links auf einen Begriff und rechts auf den passenden Partner."),grid,nx);
}

/* ---------- Üben ---------- */
function practice(topics){practiceList(Q.filter(q=>topics.includes(q.t)),()=>practice(topics))}
function practiceList(qs,again){again=again||(()=>practiceList(qs,null));
  runSession("Üben",shuffle(qs),"practice",res=>{
    record("practice",res);
    const first=res.filter(r=>r.ok).length;
    show("Üben",h("div",{class:"qcard"},h("h2",{},"Geschafft! 🎉"),h("p",{},"Beim ersten Versuch richtig: "+first+" von "+res.length+"."),h("p",{class:"sub"},"Falsche Fragen kamen am Ende noch einmal dran."),h("div",{class:"row"},h("button",{class:"pri",onclick:again},"Nochmal üben"),h("button",{onclick:()=>overview("all")},"📊 Übersicht"),h("button",{onclick:home},"Menü"))));
  });
}

/* ---------- Test ---------- */
const TESTMIX={land:3,noe:3,reg:3,stp:4,muell:4,nat:3};
function startTest(){
  let list=[];for(const t in TESTMIX){
    const pool=shuffle(Q.filter(q=>q.t===t));
    /* offene/falsche Fragen bevorzugen, damit Wiederholungen sinnvoll sind */
    pool.sort((a,b)=>isPos(a)-isPos(b));
    const chosen=[];const kinds=shuffle(["mc","tf","tx","mt","mc","mc"]);
    for(const k of kinds){if(chosen.length>=TESTMIX[t])break;const i=pool.findIndex(q=>q.k===k&&!chosen.includes(q));if(i>=0)chosen.push(pool[i])}
    for(const q of pool){if(chosen.length>=TESTMIX[t])break;if(!chosen.includes(q))chosen.push(q)}
    list.push(...chosen);
  }
  list=shuffle(list);
  runSession("Test",list,"test",res=>{
    const pts=res.reduce((a,r)=>a+r.pts,0),max=res.reduce((a,r)=>a+r.max,0),note=noteFor(pts/max*100);
    const entry={ts:Date.now(),pts,max,note,items:res.map(r=>({id:qid(r.q),q:qLabel(r.q),ok:r.ok,pts:r.pts,max:r.max,given:r.given||"",ans:r.ans}))};
    record("test",res);store.hist.unshift(entry);store.hist=store.hist.slice(0,60);save();
    resultScreen(entry);
  });
}
const NOTECOL=["","#2e9e5b","#4caf50","#d99a06","#e0701a","#d64545"];
function resultScreen(e){
  const pct=Math.round(e.pts/e.max*100),wrong=e.items.filter(i=>i.pts<i.max);
  const msg=e.note<=2?"Sehr schön gelernt!":e.note===3?"Gut, mit etwas Üben wird es noch besser.":"Übe die offenen Fragen noch einmal – du schaffst das!";
  show("Auswertung",h("div",{class:"qcard"},
    h("p",{class:"sub",style:"text-align:center"},fmtDate(e.ts)),
    h("div",{class:"note",style:"color:"+NOTECOL[e.note]},"Note "+e.note),
    h("h2",{style:"text-align:center"},NOTEN[e.note]),
    h("p",{style:"text-align:center;font-size:22px"},e.pts+" von "+e.max+" Punkten ("+pct+" %)"),
    h("p",{style:"text-align:center"},msg),
    h("p",{class:"sub",style:"text-align:center"},"Notenschlüssel: "+GRENZEN.slice(0,4).map(g=>"Note "+g[1]+" ab "+g[0]+" %").join(" · ")+", darunter Note 5"),
    h("div",{class:"row",style:"justify-content:center"},
      wrong.length?h("button",{class:"pri",onclick:()=>{const qs=wrong.map(i=>QBYID[i.id]).filter(Boolean);practiceList(qs,()=>practiceList(qs,null))}},"Fehler nochmal üben"):null,
      h("button",{onclick:startTest},"Neuer Test"),h("button",{onclick:()=>overview("all")},"📊 Übersicht"),h("button",{onclick:home},"Menü"))),
    wrong.length?h("h3",{},"Das solltest du noch üben:"):h("h3",{},"Alles richtig! 🎉"),
    ...wrong.map(r=>h("div",{class:"rev"},h("b",{},r.q),h("br"),"Punkte: "+r.pts+" von "+r.max,h("br"),"Deine Antwort: "+(r.given||"–"),h("br"),"Richtig: "+r.ans)));
}

/* ---------- Übersicht: welche Fragen sind im Test schon positiv? ---------- */
function overview(filter){
  const all=Q.length,pos=Q.filter(isPos).length,bad=Q.filter(q=>{const s=store.stat[qid(q)];return s&&s.t&&s.t.last===0}).length,open=all-pos-bad;
  const chip=(f,l)=>h("button",{class:"small",style:filter===f?"background:#2563eb;color:#fff;border-color:#2563eb":"",onclick:()=>overview(f)},l);
  const nodes=[
    h("div",{class:"qcard"},h("h2",{},"✅ "+pos+" von "+all+" Fragen im Test richtig beantwortet"),
      h("p",{},"❌ zuletzt falsch: "+bad+"  ·  ⚪ noch nicht im Test gefragt: "+open),
      h("div",{class:"bar"},h("i",{style:"width:"+Math.round(pos/all*100)+"%;background:#2e9e5b"})),
      h("p",{class:"sub"},"Positiv = die Frage wurde bei ihrem letzten Auftreten im Test voll richtig beantwortet."),
      h("div",{class:"row"},chip("all","Alle"),chip("neg","Noch nicht positiv"),chip("pos","Positiv"),
        (all-pos)?h("button",{class:"pri small",onclick:()=>practiceList(Q.filter(q=>!isPos(q)),null)},"✏️ Nicht positive Fragen üben"):null))];
  TOPICS.forEach(t=>{
    const qs=Q.filter(q=>q.t===t.id),tp=qs.filter(isPos).length;
    const shown=qs.filter(q=>filter==="all"||(filter==="pos"?isPos(q):!isPos(q)));
    if(!shown.length)return;
    const d=h("details",{},h("summary",{},t.icon+" "+t.title+" – "+tp+" / "+qs.length+" positiv"));
    if(filter!=="all")d.setAttribute("open","");
    shown.forEach(q=>{const s=store.stat[qid(q)]||{},tt=s.t,pp=s.p;
      const st=tt?(tt.last===1?"✅":"❌"):"⚪";
      const info=[tt?"Test: "+tt.ok+"× richtig, "+tt.bad+"× falsch":"Test: noch nicht gefragt",pp?"Üben: "+pp.ok+"× richtig, "+pp.bad+"× falsch":null].filter(Boolean).join(" · ");
      d.append(h("div",{class:"ov"},h("span",{class:"st"},st),h("div",{},qLabel(q),h("small",{},maxPts(q)+(maxPts(q)>1?" Punkte":" Punkt")+" · "+info))))});
    nodes.push(d);
  });
  show("Übersicht",...nodes);
}

/* ---------- Verlauf ---------- */
function history(){
  const nodes=[];
  if(!store.hist.length)nodes.push(h("div",{class:"qcard"},h("h2",{},"Noch kein Test gemacht"),h("p",{},"Nach dem ersten Test erscheint er hier mit Punkten und Note."),h("button",{class:"pri",onclick:startTest},"Test starten")));
  else{
    const avg=store.hist.slice(0,5).reduce((a,e)=>a+e.note,0)/Math.min(5,store.hist.length);
    nodes.push(h("p",{class:"sub"},store.hist.length+" Test(s) gespeichert · Durchschnittsnote der letzten "+Math.min(5,store.hist.length)+": "+avg.toFixed(1).replace(".",",")+" · Antippen zeigt die Details"));
    store.hist.forEach(e=>nodes.push(h("button",{class:"opt hist",style:"margin:8px 0",onclick:()=>resultScreen(e)},h("span",{},fmtDate(e.ts)),h("b",{style:"color:"+NOTECOL[e.note]},"Note "+e.note+" · "+e.pts+"/"+e.max+" Punkte"))));
  }
  show("Verlauf",...nodes);
}
load();home();
